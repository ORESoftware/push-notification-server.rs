name: Rust Lockfile

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Verify-only by design. The previous normalize job ran cargo
  # generate-lockfile (a whole-graph re-resolution) and bot-committed the
  # result with the default GITHUB_TOKEN, which both bypassed human review of
  # dependency changes and produced commits no workflow ever tested. A stale
  # lockfile now fails here and the contributor commits the fix themselves.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lockfile
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fail when Cargo.lock is out of sync with Cargo.toml
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: Fail when Cargo.lock is not the committed, canonical form
        run: git diff --exit-code -- Cargo.lock
