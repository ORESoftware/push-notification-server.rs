name: temporary aws-lc lock resolver

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/resolve-aws-lc-lock-20260915
          persist-credentials: true
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884
        with:
          toolchain: 1.88.0
      - name: Resolve and compile all features
        run: cargo check --all-features
      - name: Commit resolver-produced lockfile only
        run: |
          git rm .github/workflows/tmp-resolve-aws-lc-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --exit-code && { echo 'resolver produced no changes'; exit 1; } || true
          git commit -m 'chore(lock): resolve aws-lc dependency graph'
          git push origin HEAD:tmp/resolve-aws-lc-lock-20260915
